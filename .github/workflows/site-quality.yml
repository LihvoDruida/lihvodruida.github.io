name: Site Quality Gates

on:
  pull_request:
    branches: ["live"]
  push:
    branches: ["live"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jekyll:
    name: Jekyll build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site strictly
        run: bundle exec jekyll build --trace --strict_front_matter
        env:
          JEKYLL_ENV: production

  data:
    name: YAML and Python data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate YAML data files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('_data').glob('*.yml')):
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f'OK {path}')
          PY
      - name: Compile Python scripts
        run: python -m compileall -q scripts

  dashboard:
    name: Dashboard lightweight check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run inspect:ci

  worker:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check workers/guild-applications-worker/src/index.js

