name: Site Quality Gates

on:
  pull_request:
    branches: ["live"]
  push:
    branches: ["live"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Якщо тека дашборда або воркера переїде — правити треба тільки тут.
  DASHBOARD_DIR: dashboard
  WORKER_ENTRY: workers/guild-applications-worker/src/index.js

jobs:
  jekyll:
    name: Jekyll build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site strictly
        run: bundle exec jekyll build --trace --strict_front_matter
        env:
          JEKYLL_ENV: production

  data:
    name: YAML and Python data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate YAML data files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('_data').glob('*.yml')):
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f'OK {path}')
          PY
      - name: Compile Python scripts
        run: python -m compileall -q scripts

  dashboard:
    name: Dashboard lightweight check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Кеш setup-node падає, якщо cache-dependency-path не резолвиться,
      # тому спершу перевіряємо, що проєкт і лок-файл узагалі на місці.
      - name: Detect dashboard project
        id: detect
        run: |
          set -euo pipefail
          if [ -f "$DASHBOARD_DIR/package.json" ]; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Дашборд не знайдено::$DASHBOARD_DIR/package.json відсутній — джоба пропущена"
          fi

          if [ -f "$DASHBOARD_DIR/package-lock.json" ]; then
            echo "lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Немає лок-файлу::$DASHBOARD_DIR/package-lock.json не закомічено — кеш вимкнено, npm ci замінено на npm install"
          fi

      - name: Setup Node
        if: steps.detect.outputs.project == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Порожній рядок = кешування вимкнено. Вмикаємо лише за наявності лок-файлу.
          cache: ${{ steps.detect.outputs.lockfile == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.detect.outputs.lockfile == 'true' && format('{0}/package-lock.json', env.DASHBOARD_DIR) || '' }}
          package-manager-cache: false

      - name: Install dependencies
        if: steps.detect.outputs.project == 'true'
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Run inspection
        if: steps.detect.outputs.project == 'true'
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: npm run inspect:ci

  worker:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect worker entry point
        id: detect
        run: |
          set -euo pipefail
          if [ -f "$WORKER_ENTRY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Воркер не знайдено::$WORKER_ENTRY відсутній — джоба пропущена"
          fi

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax check
        if: steps.detect.outputs.present == 'true'
        run: node --check "$WORKER_ENTRY"
