name: Update Characters

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch Raider.IO and update YAML
        run: python scripts/update_characters.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/characters.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update characters from Raider.IO"
            git push
          else
            echo "::error::No changes to commit. Workflow stopped."
            exit 1
          fi