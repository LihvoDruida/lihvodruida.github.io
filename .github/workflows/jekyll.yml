name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["live"]
  workflow_dispatch:
  workflow_run:
    # Додаємо сюди назви всіх воркфлоу, які оновлюють дані
    workflows: ["Update Characters", "Update Guild Data", "Update Mods"]
    types:
      - completed
    branches: ["live"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Ця перевірка критично важлива:
    # Білд запуститься ТІЛЬКИ якщо воркфлоу-джерело (наприклад, Update Mods) завершився успішно (зеленим).
    # Якщо там було "No changes" (червоний exit 1), то цей білд пропуститься.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: 'live'

      - name: Setup Ruby
        uses: ruby/setup-ruby@bfefad842bb982ff05b233bcbc1571d97a87e69f
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4