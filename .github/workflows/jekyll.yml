name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["live"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Project Data"]
    types: [completed]
    branches: ["live"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll artifact
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout live branch
        uses: actions/checkout@v7
        with:
          ref: live
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Jekyll incremental data
        uses: actions/cache@v5
        with:
          path: |
            .jekyll-cache
            .jekyll-metadata
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml', '**/*.md', '**/*.html', 'assets/css/**/*.css', 'assets/js/**/*.js', '_data/**/*.yml') }}
          restore-keys: |
            jekyll-${{ runner.os }}-

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
