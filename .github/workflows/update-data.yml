name: Update Project Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-data-update-live
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task:
          - name: mods
            script: scripts/update_mods.py
            files: "_data/my_mods.yml"
            message: "chore: update mods data"

          - name: guild
            script: scripts/update_guild.py
            files: "_data/guild.yml _data/professions.yml"
            message: "chore: update guild data"

          - name: characters
            script: scripts/update_characters.py
            files: "_data/characters.yml"
            message: "chore: update characters data"

    env:
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}

    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync with remote live
        run: git pull --rebase origin live

      - name: Run updater with API retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python "${{ matrix.task.script }}"; then
              exit 0
            fi
            echo "Retry attempt ${attempt}/3..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Commit changed data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ${{ matrix.task.files }}
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.task.name }}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "${{ matrix.task.message }}"
          git pull --rebase origin live
          git push origin HEAD:live
          echo "✔ ${{ matrix.task.name }} updated" >> "$GITHUB_STEP_SUMMARY"
