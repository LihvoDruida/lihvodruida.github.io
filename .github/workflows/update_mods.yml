name: Update Mods

on:
  schedule:
    # Запуск раз на добу о 08:00 UTC. 
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch CurseForge and update YAML
        run: python scripts/update_mods.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/my_mods.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update mods from CurseForge"
            git push
          else
            echo "::error::No changes to mods found. Workflow stopped."
            exit 1
          fi