name: Node site quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dashboard_ref:
        description: 'Dashboard branch, tag or commit for paired tests'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: node-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:ci
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The dashboard repository is a monorepo; the Next.js app lives in dashboard/.
  # Runs the dashboard-paired contract tests that `verify` skips
  # (pair, content-pair, raid-seasons) against the real dashboard sources, plus the
  # dashboard's own pairing checks against this site. Paired changes live on
  # same-named branches: a dashboard branch named like this one is used when it
  # exists, otherwise the dashboard default branch (or workflow_dispatch input).
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Pick dashboard ref
        id: dashboard
        shell: bash
        env:
          INPUT_REF: ${{ inputs.dashboard_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ] && git ls-remote --exit-code --heads https://github.com/LihvoDruida/lihvodruida-dashboard "refs/heads/$BRANCH" >/dev/null; then ref="$BRANCH"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Dashboard ref: ${ref:-default branch}"
      - uses: actions/checkout@v5
        with:
          repository: LihvoDruida/lihvodruida-dashboard
          ref: ${{ steps.dashboard.outputs.ref }}
          path: .paired-dashboard
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: .paired-dashboard/dashboard
      - name: Locate PGlite for the SQL revision test
        run: |
          dir="$GITHUB_WORKSPACE/.paired-dashboard/dashboard/node_modules/@electric-sql/pglite"
          if [ ! -d "$dir" ]; then
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite
            dir="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite"
          fi
          echo "SITE_SYNC_PG_MODULE=$dir" >> "$GITHUB_ENV"
      - name: Paired tests (no skips allowed)
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PAIRED_DASHBOARD_ROOT: ${{ github.workspace }}/.paired-dashboard/dashboard
        run: |
          npm run pretypecheck
          node --import tsx --test --test-reporter=tap tests/*.test.ts | tee paired.tap
          grep -q '^# skipped 0$' paired.tap || { echo '::error::Paired tests were skipped'; exit 1; }
      - name: Dashboard pairing checks (release docs, application pair)
        shell: bash
        working-directory: .paired-dashboard/dashboard
        env:
          PAIRED_SITE_ROOT: ${{ github.workspace }}
        run: |
          # check-release-docs compares ../lihvodruida-site (next to the dashboard
          # checkout): version, scripts and the byte-identical install guide.
          ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/lihvodruida-site"
          node scripts/check-release-docs.cjs
          node scripts/check-application-site-pair.cjs
