name: Update Guild Application Status

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number for the guild application
        required: true
        type: string
      status:
        description: Target status: accepted or declined
        required: true
        type: choice
        options:
          - accepted
          - declined
      moderator:
        description: Discord moderator display name
        required: false
        type: string
  repository_dispatch:
    types:
      - guild_application_status

permissions:
  issues: write
  contents: read

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve inputs
        id: input
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ISSUE_NUMBER='${{ github.event.client_payload.issue_number }}'
            STATUS='${{ github.event.client_payload.status }}'
            MODERATOR='${{ github.event.client_payload.moderator }}'
          else
            ISSUE_NUMBER='${{ inputs.issue_number }}'
            STATUS='${{ inputs.status }}'
            MODERATOR='${{ inputs.moderator }}'
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue_number: $ISSUE_NUMBER" >&2
            exit 1
          fi

          case "$STATUS" in
            accepted|declined) ;;
            *) echo "Invalid status: $STATUS" >&2; exit 1 ;;
          esac

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "moderator=${MODERATOR:-Discord}" >> "$GITHUB_OUTPUT"

      - name: Ensure status labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'guild-application', color: '5865F2', description: 'Guild application issue' },
              { name: 'status:review', color: 'D4A63A', description: 'Заявка на розгляді' },
              { name: 'status:accepted', color: '3BA55D', description: 'Заявку прийнято' },
              { name: 'status:declined', color: 'ED4245', description: 'Заявку відхилено' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

      - name: Apply selected status
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          STATUS: ${{ steps.input.outputs.status }}
          MODERATOR: ${{ steps.input.outputs.moderator }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const status = process.env.STATUS;
            const moderator = process.env.MODERATOR || 'Discord';
            const statusLabels = ['status:review', 'status:accepted', 'status:declined', 'status:approved', 'status:rejected'];
            const targetLabel = status === 'accepted' ? 'status:accepted' : 'status:declined';
            const title = status === 'accepted' ? 'Прийнято' : 'Відхилено';

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const currentLabels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const labelsToRemove = currentLabels.filter((name) => statusLabels.includes(name) && name !== targetLabel);

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['guild-application', targetLabel],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `### ${title}\n\nСтатус змінено через Discord-кнопку.\n\n**Модератор:** ${moderator}`,
            });
