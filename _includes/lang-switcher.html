<script>
    // Відображення вибраної мови у випадаючому меню
    function changeLanguage(lang) {
        console.log(`Switching language to: ${lang}`);

        // Зберігаємо активну мову в локальному сховищі
        localStorage.setItem('active_lang', lang);

        // Формуємо URL для нової мови
        const currentPath = window.location.pathname;
        const currentLangPrefix = currentPath.split('/')[1];
        const isDefaultLang = lang === '{{ site.default_lang }}';

        // Формуємо новий шлях без зайвих / або з мовним префіксом
        let newPath;
        if (isDefaultLang) {
            newPath = currentPath.replace(`/${currentLangPrefix}`, '') || '/';
        } else {
            newPath = `/${lang}${currentPath.replace(`/${currentLangPrefix}`, '')}`;
        }

        // Уникаємо помилок через порожній шлях
        if (!newPath.startsWith('/')) {
            newPath = '/' + newPath;
        }

        // Перенаправляємо користувача на нову сторінку
        const newUrl = window.location.origin + newPath;
        console.log(`Redirecting to: ${newUrl}`);
        window.location.href = newUrl;
    }

    // Ініціалізація при завантаженні сторінки
    document.addEventListener('DOMContentLoaded', () => {
        const activeLang = localStorage.getItem('active_lang') || '{{ site.default_lang }}';

        // Встановлюємо текст кнопки відповідно до активної мови
        const langButton = document.getElementById('current-language');
        const langName = document.querySelector(`#lang-span-${activeLang}`)?.textContent ||
            document.querySelector(`#lang-link-${activeLang}`)?.textContent;

        if (langName) {
            langButton.textContent = langName;
        } else {
            changeLanguage(activeLang); // Якщо мова відсутня у локальному сховищі
        }
    });
</script>
