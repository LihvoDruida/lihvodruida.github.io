<script>
    function changeLanguage(lang) {
        console.log(`Switching language to: ${lang}`);

        // Зберігаємо активну мову в локальному сховищі
        localStorage.setItem('active_lang', lang);

        // Формуємо URL для нової мови
        const isDefaultLang = lang === '{{ site.default_lang }}';
        const newUrl = isDefaultLang ? '{{ page.url }}' : `/${lang}{{ page.url }}`;

        // Перевірка, чи сторінка не перенаправляється на порожню сторінку
        if (window.location.href !== newUrl) {
            window.location.href = newUrl;
        }
    }

    // Ініціалізація при завантаженні сторінки
    document.addEventListener('DOMContentLoaded', () => {
        const activeLang = localStorage.getItem('active_lang') || '{{ site.default_lang }}';
        
        // Перевірка наявності активної мови
        const langButton = document.getElementById('current-language');
        const langName = document.querySelector(`#lang-span-${activeLang}`)?.textContent ||
            document.querySelector(`#lang-link-${activeLang}`)?.textContent;

        if (langName) {
            langButton.textContent = langName;
        } else {
            changeLanguage(activeLang); // Якщо мова відсутня у локальному сховищі
        }
    });
</script>
