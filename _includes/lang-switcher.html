<div class="lang-switcher">
    {% for lang in site.languages %}
    {% assign lang_name = site.data[lang].l10n.lang_name %}

    {% if lang == site.active_lang %}
    <!-- Активна мова відображається як текст (span) -->
    <span id="lang-span-{{ lang }}" class="active-lang">{{ lang_name }}</span>
    {% else %}
    <!-- Для неактивних мов — посилання -->
    <a href="javascript:void(0);" id="lang-link-{{ lang }}" onclick="changeLanguage('{{ lang }}')">
        {{ lang_name }}
    </a>
    {% endif %}
    {% endfor %}
</div>


<script>
    // Функція для зміни мови
    function changeLanguage(lang) {
        // Видалення існуючого елемента <span> активної мови
        const activeSpan = document.querySelector('.lang-switcher .active-lang');
        if (activeSpan) {
            const langCode = activeSpan.id.replace('lang-span-', '');
            // Перетворення <span> назад у <a>
            const newLink = document.createElement('a');
            newLink.id = 'lang-link-' + langCode;
            newLink.href = 'javascript:void(0);';
            newLink.textContent = activeSpan.textContent;
            newLink.setAttribute('onclick', `changeLanguage('${langCode}')`);
            activeSpan.replaceWith(newLink);
        }

        // Знаходимо нове посилання для активної мови
        const newActiveLink = document.getElementById('lang-link-' + lang);
        if (newActiveLink) {
            // Перетворення <a> у <span> для активної мови
            const newSpan = document.createElement('span');
            newSpan.id = 'lang-span-' + lang;
            newSpan.className = 'active-lang';
            newSpan.textContent = newActiveLink.textContent;
            newActiveLink.replaceWith(newSpan);

            // Оновлення локального сховища браузера з активною мовою
            localStorage.setItem('active_lang', lang);

            // Логіка для оновлення вмісту сторінки (якщо потрібно)
            updateContentForLanguage(lang);
        } else {
            console.error('No link found for language:', lang);
        }
    }

    // Оновлення вмісту сторінки для вибраної мови (приклад)
    function updateContentForLanguage(lang) {
        console.log(`Content updated for language: ${lang}`);
        // Додайте логіку для зміни контенту відповідно до вибраної мови
        // Наприклад, AJAX-запит для динамічного завантаження текстів.
    }

    // Перевірка локального сховища браузера при завантаженні сторінки
    document.addEventListener('DOMContentLoaded', () => {
        const activeLang = localStorage.getItem('active_lang') || '{{ site.default_lang }}';
        console.log('Activating language:', activeLang);
        changeLanguage(activeLang);
    });

</script>
