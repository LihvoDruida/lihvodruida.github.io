<nav class="navbar fixed-top navbar-expand-lg bg-white mb-0 rounded-0">
  <div class="container">
    <div class="navbar-translate">
      <a class="navbar-brand font-weight-bold" href="{{ site.baseurl }}/">{{ site.title }}</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="navbar-toggler-icon"></span>
        <span class="navbar-toggler-icon"></span>
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a href="{{ site.baseurl }}/donate" class="nav-link rubik-wet-paint">{{ site.data.l10n.donate | escape }}</a>
        </li>
      </ul>

      <form class="form-inline ml-auto" autocomplete="off">
        <div id="search-container" class="form-group no-border">
          <i class="material-icons">search</i>
          <input id="search-input" type="text" class="form-control" placeholder="Search">
          <ul id="results-container"></ul>
        </div>

        <script src="{{ site.baseurl }}/assets/js/jekyll-search.js" type="text/javascript"></script>
        <script type="text/javascript">
          SimpleJekyllSearch.init({
            searchInput: document.getElementById('search-input'),
            resultsContainer: document.getElementById('results-container'),
            dataSource: '{{ "search.json" | relative_url }}',
            searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
            noResultsText: '<li><a href="#">{{site.data.strings.search_no_results_text}}</a></li>',
            limit: 10,
            fuzzy: true,
          })
        </script>
      </form>

      <div class="nav-item">
        <div class="language-selector">
          <button id="current-language" class="dropdown-btn rubik-wet-paint">
            {% assign current_lang_name = site.data[site.active_lang].l10n.lang_name %}
            {{ current_lang_name }}
          </button>
          <div class="dropdown-content">
            {% for lang in site.languages %}
            {% assign lang_name = site.data[lang].l10n.lang_name %}

            {% if lang == site.active_lang %}
            <!-- Активна мова відображається як текст -->
            <span id="lang-span-{{ lang }}" class="active-lang">{{ lang_name }}</span>
            {% else %}
            <!-- Для неактивних мов — посилання -->
            <a href="javascript:void(0);" id="lang-link-{{ lang }}" onclick="changeLanguage('{{ lang }}')">
              {{ lang_name }}
            </a>
            {% endif %}
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
