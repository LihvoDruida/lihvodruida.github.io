name = "guild-applications-worker"
main = "src/index.js"
compatibility_date = "2026-04-18"

[observability]
enabled = true

[vars]
GITHUB_OWNER = "LihvoDruida"
GITHUB_REPO = "lihvodruida.github.io"
GUILD_APPLICATIONS_LABEL = "guild-application"
ALLOWED_ORIGINS = "https://lihvodruida.pp.ua,https://www.lihvodruida.pp.ua,http://127.0.0.1:4000,http://localhost:4000"
DISCORD_ALLOWED_ROLES = ""


# Set these via `wrangler secret put ...` in production:
# DISCORD_BOT_TOKEN
# DISCORD_PUBLIC_KEY
# DISCORD_GUILD_ID
# GITHUB_TOKEN

# Rules accept/decline counters. Create once:
# wrangler kv namespace create RULES_STATS
# Then paste the returned id below.
# [[kv_namespaces]]
# binding = "RULES_STATS"
# id = "paste_kv_namespace_id_here"
