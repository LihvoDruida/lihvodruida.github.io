name = "guild-applications-worker"
main = "src/index.js"
compatibility_date = "2026-04-18"

[observability]
enabled = true

[vars]
GITHUB_OWNER = "LihvoDruida"
GITHUB_REPO = "lihvodruida.github.io"
GUILD_APPLICATIONS_LABEL = "guild-application"
ALLOWED_ORIGINS = "https://lihvodruida.pp.ua,https://www.lihvodruida.pp.ua,https://admin.lihvodruida.pp.ua,http://127.0.0.1:4000,http://localhost:4000"
DISCORD_ALLOWED_ROLES = ""
ADMIN_DASHBOARD_URL = "https://admin.lihvodruida.pp.ua"
DASHBOARD_PROFILE_LOOKUP_ENDPOINT = "https://admin.lihvodruida.pp.ua/api/profile/discord-lookup"
ALLOW_DEBUG_QUERY = "0"


# Set these via `wrangler secret put ...` in production:
# DISCORD_BOT_TOKEN
# DISCORD_PUBLIC_KEY
# DISCORD_GUILD_ID
# GITHUB_TOKEN
# INTERNAL_PROFILE_LOOKUP_TOKEN
# CF_ACCESS_CLIENT_ID        # Cloudflare Access Service Auth, if admin dashboard is protected
# CF_ACCESS_CLIENT_SECRET    # Cloudflare Access Service Auth, if admin dashboard is protected
# DISCORD_RULES_STATS_TOKEN  # Optional shared token for dashboard stats/signups reads

# Rules accept/decline counters and raid-rules signup list. Create once:
# wrangler kv namespace create RULES_STATS
# Then paste the returned id below.
# Raid rules additionally use ADMIN_DASHBOARD_URL and INTERNAL_PROFILE_LOOKUP_TOKEN
# to verify dashboard authorization and main character. If the admin dashboard
# is protected by Cloudflare Access, set CF_ACCESS_CLIENT_ID and
# CF_ACCESS_CLIENT_SECRET as Worker secrets too.
# [[kv_namespaces]]
# binding = "RULES_STATS"
# id = "paste_kv_namespace_id_here"
# Optional for raid announcement buttons when the Discord Interaction Endpoint points to this Worker:
# DASHBOARD_RAID_ACTION_ENDPOINT = "https://admin.lihvodruida.pp.ua/api/raids/{raidId}/discord-action"
