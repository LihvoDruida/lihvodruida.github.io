# Довідник рейдів і сезонів.
#
# Файл наполовину автоматичний. scripts/update_guild.py тягне довідник рейдів
# з Raider.IO (/api/v1/raiding/static-data) і перезаписує ТІЛЬКИ ці ключі:
#   metadata, catalog, derived_seasons, derived_current_season,
#   unassigned, undetected, а також додає нові записи в names.
# Ручні ключі, які скрипт ніколи не чіпає:
#   current_season, seasons і вже наявні підписи в names.
#
# СЕЗОНИ ВИЗНАЧАЮТЬСЯ АВТОМАТИЧНО.
# Скрипт сам розкладає рейди по доповненнях і сезонах:
#   • агрегати виду "tier-mn-1" — доповнення й номер сезону читаються зі слага;
#   • звичайні рейди — доповнення з каталогу, сезон із дат starts/ends.
# Результат лягає в derived_seasons. Список seasons нижче — ручне
# перевизначення: поки він непорожній, використовується саме він.
# Щоб перейти на повну автоматику, очисти seasons і current_season
# (після першої успішної синхронізації, щоб derived_seasons уже існували).
#
# Raider.IO віддає raid_progression як плаский словник {slug: {...}} без жодної
# інформації про сезон, тому прив'язку робимо тут вручну.
#
# Як додати новий сезон (наприклад, коли вийде Midnight Season 2):
#   1. Дізнатися slug нового тиру — він з'явиться сам у _data/guild.yml
#      після наступної синхронізації (напр. "tier-mn-2").
#   2. Додати сезон у початок списку seasons.
#   3. Перевести current_season на його id.
# Рейди з невідомим slug не зникають — вони автоматично потрапляють
# у групу «Інші рейди» наприкінці списку.

current_season: midnight-1

seasons:
  - id: midnight-1
    expansion: Midnight
    label: "Midnight · Сезон 1"
    short: "Сезон 1"
    raids:
      - tier-mn-1
      - sporefall

  - id: tww-3
    expansion: The War Within
    label: "The War Within · Сезон 3"
    short: "TWW S3"
    raids:
      - manaforge-omega

  - id: tww-2
    expansion: The War Within
    label: "The War Within · Сезон 2"
    short: "TWW S2"
    raids:
      - liberation-of-undermine

  - id: tww-1
    expansion: The War Within
    label: "The War Within · Сезон 1"
    short: "TWW S1"
    raids:
      - nerubar-palace
      - blackrock-depths

names:
  tier-mn-1:
    title: "Стартові рейди Midnight"
    subtitle: "Voidspire · Dreamrift · March on Quel'Danas"
  sporefall:
    title: "Sporefall"
    subtitle: "Rotmire — рейд на одного боса, патч 12.0.7"
  manaforge-omega:
    title: "Manaforge Omega"
    subtitle: "Фінальний рейд The War Within"
  liberation-of-undermine:
    title: "Liberation of Undermine"
    subtitle: "Рейд другого сезону The War Within"
  nerubar-palace:
    title: "Nerub-ar Palace"
    subtitle: "Стартовий рейд The War Within"
  blackrock-depths:
    title: "Blackrock Depths"
    subtitle: "Ювілейний рейд, патч 11.0.5"
