# =========================================================
# УМОВИ ДОБРОВІЛЬНОЇ ПІДТРИМКИ
#
# Реквізити одержувача заповнені. Якщо зміниться правова форма
# (наприклад, відкриття ФОП) — онови блок recipient і піднми version.
#
# ⚠️ Це шаблон, а не юридична консультація. Перед публікацією
#    показати юристу — насамперед розділи про податки та статус
#    одержувача (фізособа чи ФОП: від цього залежить ставка та
#    порядок декларування).
# =========================================================

version: "1.0"
effective_date: "2026-08-10"

# Дані одержувача підтримки
recipient:
  name: "Halytskyi Dmytro"
  # Правова форма. Якщо колись відкриєш ФОП — зміни тут і заповни registry_id.
  status: "Фізична особа"
  # РНОКПП/ЄДРПОУ. Для фізособи не публікується — рядок лишається порожнім.
  registry_id: ""
  # Робоча пошта для юридичних звернень і запитів щодо персональних даних
  email: "lihvo.druida@gmail.com"
  country: "Україна"
  # Строк відповіді на звернення — узгоджений із розділом 12 Умов
  response_days: 30

# Короткий блок над кнопками — те, що людина реально прочитає
summary:
  - Підтримка є добровільним і безповоротним дарунком, а не оплатою товарів чи послуг.
  - Донат не створює жодних зобов'язань і не дає жодних привілеїв.
  - Кошти не повертаються, окрім випадку помилкового платежу.
  - Нік і повідомлення можуть бути показані публічно на стрімі та на сайті.

sections:
  - id: general
    title: "1. Загальні положення"
    items:
      - Ці Умови регулюють добровільну фінансову підтримку («донат»), яку відвідувачі сайту надають автору проєкту.
      - Одержувачем підтримки є фізична особа, зазначена в розділі «Реквізити та контакти» цих Умов.
      - Здійснення платежу означає, що донатер прочитав ці Умови, повністю з ними погоджується та приймає їх без застережень.
      - Якщо ви не згодні з будь-яким пунктом — не здійснюйте платіж.

  - id: nature
    title: "2. Правова природа платежу"
    items:
      - Донат є безоплатною та безповоротною передачею коштів у власність одержувача й за своєю природою відповідає договору дарування (ст. 717 Цивільного кодексу України).
      - "Договір є реальним: він вважається укладеним у момент зарахування коштів і не потребує окремого підписання."
      - Ця сторінка НЕ є публічною офертою на продаж товарів, робіт чи послуг у розумінні ст. 633 та 641 Цивільного кодексу України.
      - Оскільки товар не продається і послуга не надається, до цих відносин не застосовується Закон України «Про захист прав споживачів», зокрема положення про повернення товару та відмову від договору.
      - Донат не є інвестицією, позикою, передоплатою, членським внеском, благодійним пожертвуванням у розумінні Закону України «Про благодійну діяльність та благодійні організації» або платежем за будь-який очікуваний результат.

  - id: no_obligations
    title: "3. Відсутність зустрічних зобов'язань"
    items:
      - "Донат не породжує для одержувача жодних зобов'язань: ані створити конкретний контент, ані дотримати строків, ані зберегти проєкт, сайт, стріми чи будь-який сервіс у поточному вигляді."
      - Донат не надає донатеру прав співавтора, співвласника, партнера, права на частку доходу, права голосу чи будь-якого впливу на зміст і напрям проєкту.
      - Донат не є гарантією згадки, відповіді, зворотного зв'язку чи будь-якої персональної уваги.
      - Будь-які подяки, згадки чи бонуси є добровільним жестом одержувача й можуть бути змінені або скасовані в будь-який момент без попередження.

  - id: refunds
    title: "4. Повернення коштів"
    items:
      - За загальним правилом кошти не повертаються, оскільки право власності на них переходить до одержувача в момент зарахування.
      - "Виняток — помилковий платіж: технічний збій, дублювання транзакції або суттєва помилка в сумі. У такому разі зверніться на контактну пошту протягом 14 календарних днів із дати платежу, зазначивши дату, суму та останні цифри платіжного інструмента."
      - Кожне звернення розглядається індивідуально в розумний строк. Рішення про повернення ухвалює одержувач; підтвердження помилки не є автоматичною підставою для повернення.
      - Комісії платіжних сервісів і банків при поверненні не компенсуються.
      - Зловживання процедурою повернення, зокрема безпідставні чарджбеки, може мати наслідком блокування донатера в спільнотах проєкту.

  - id: donor_warranties
    title: "5. Заяви та гарантії донатера"
    items:
      - Донатер підтверджує, що діє добровільно, усвідомлено та без примусу.
      - Донатер підтверджує, що кошти належать йому на законних підставах і мають законне походження, а платіжний інструмент використовується правомірно.
      - Донат із платіжного інструмента третьої особи без її відома та згоди заборонений. Відповідальність за такий платіж несе виключно донатер.
      - Особи, які не досягли 18 років, можуть здійснювати донат лише за згодою батьків або інших законних представників.
      - Донатер самостійно оцінює свою фінансову спроможність. Підтримка не повинна шкодити його матеріальному становищу або становищу його родини.

  - id: messages
    title: "6. Повідомлення до донату"
    items:
      - Повідомлення, ім'я або нік, залишені при донаті, можуть бути публічно показані на трансляціях, на цьому сайті, у соціальних мережах і в записах трансляцій без обмеження строку та території.
      - Надсилаючи повідомлення, донатер надає одержувачу безоплатну, невиключну, безстрокову ліцензію на його відтворення, публічний показ, повідомлення на загал і включення до аудіовізуальних записів проєкту.
      - Донатер гарантує, що повідомлення не порушує прав третіх осіб.
      - "Заборонено надсилати повідомлення, що містять: заклики до насильства чи ворожнечі; матеріали, що ображають за ознаками раси, етнічного походження, статі, віросповідання, стану здоров'я, сексуальної орієнтації; порнографію; персональні дані третіх осіб; рекламу, спам чи посилання на шкідливі ресурси; погрози, цькування або наклеп; матеріали, що порушують авторські права; будь-що інше, заборонене законодавством України."
      - Одержувач має право не оприлюднювати повідомлення, відредагувати або видалити його повністю чи частково, без пояснення причин і без повернення коштів.
      - "Донат, здійснений із метою поширення забороненого контенту, не є підставою для повернення коштів: кошти можуть бути передані на благодійність на розсуд одержувача."

  - id: payments
    title: "7. Платіжні сервіси"
    items:
      - "Приймання платежів здійснюють сторонні сервіси: Monobank (АТ «Універсал Банк») і Donatello."
      - Одержувач не є платіжною установою, не обробляє й не зберігає реквізити платіжних карток. Ці дані обробляються виключно платіжними сервісами відповідно до їхніх власних умов і політик.
      - До обробки платежу додатково застосовуються умови відповідного сервісу. Радимо ознайомитися з ними перед платежем.
      - Одержувач не відповідає за збої, затримки, комісії, ліміти чи відмови на боці платіжних сервісів, банків або платіжних систем.

  - id: personal_data
    title: "8. Персональні дані"
    items:
      - Обробка персональних даних здійснюється відповідно до Закону України «Про захист персональних даних» № 2297-VI, а для осіб із ЄС/ЄЕЗ — також відповідно до GDPR (Регламент ЄС 2016/679).
      - "Обсяг даних, які одержувач фактично бачить: ім'я або нік, зазначений донатером, сума, дата й час платежу, текст повідомлення. Реквізити картки одержувачу не передаються."
      - "Мета обробки: публічна подяка та показ підтримки, ведення обліку надходжень, виконання податкових обов'язків, розгляд звернень щодо помилкових платежів."
      - "Правова підстава: згода донатера, надана шляхом здійснення платежу (ст. 6(1)(a) GDPR), а також законний інтерес одержувача у веденні обліку (ст. 6(1)(f) GDPR) і виконання обов'язку, встановленого законом (ст. 6(1)(c) GDPR)."
      - "Строк зберігання: дані про надходження зберігаються стільки, скільки цього вимагає податкове законодавство; публічні повідомлення — доки їх показ залишається доречним."
      - Донатер має право на доступ до своїх даних, їх виправлення, видалення, обмеження обробки, заперечення проти обробки та відкликання згоди. Для реалізації прав — звернення на контактну пошту.
      - Донатер може попросити прибрати свій нік і повідомлення з публічного показу. Це не тягне за собою повернення коштів.
      - Не вказуйте в повідомленні персональні дані — свої чи чужі. Одержувач не несе відповідальності за дані, які донатер оприлюднив добровільно.

  - id: taxes
    title: "9. Оподаткування"
    items:
      - Одержувач самостійно виконує свої податкові обов'язки щодо отриманих коштів згідно із законодавством України.
      - Донатер самостійно несе відповідальність за виконання податкових та інших обов'язків, які можуть виникати в нього за законодавством країни його резидентності.
      - Одержувач не надає донатеру документів, що підтверджують витрати для цілей оподаткування, оскільки платіж не є оплатою товарів чи послуг.

  - id: liability
    title: "10. Обмеження відповідальності"
    items:
      - Проєкт, сайт і його матеріали надаються «як є». Одержувач не гарантує безперебійної роботи сайту, доступності сервісів чи збереження будь-яких матеріалів.
      - Одержувач не відповідає за непрямі збитки, упущену вигоду чи нематеріальну шкоду, пов'язані з донатом або використанням сайту.
      - Відповідальність одержувача в будь-якому разі обмежується сумою конкретного донату.
      - Одержувач не пов'язаний із Blizzard Entertainment і не є її представником. World of Warcraft і пов'язані позначення належать їхнім правовласникам. Донати не мають жодного стосунку до ігрових послуг і не є оплатою внутрішньоігрових благ.

  - id: changes
    title: "11. Зміни умов"
    items:
      - Одержувач має право змінювати ці Умови в односторонньому порядку.
      - Нова редакція діє з моменту публікації на цій сторінці. Номер редакції та дата набрання чинності вказані нижче.
      - До вже здійснених донатів застосовується редакція, чинна на момент платежу.

  - id: law
    title: "12. Право та вирішення спорів"
    items:
      - До цих Умов застосовується матеріальне право України.
      - Сторони докладають зусиль для врегулювання спорів шляхом переговорів. Обов'язковий досудовий порядок — письмове звернення на контактну пошту з відповіддю протягом 30 календарних днів.
      - Спори, не врегульовані переговорами, вирішуються судами України за підсудністю, встановленою законом.
      - Недійсність окремого пункту не тягне недійсності Умов у цілому.
