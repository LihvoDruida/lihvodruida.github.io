---
layout: default
permalink: /community/
---

<div class="container">
  <div class="page-content">
    {% assign lang = site.active_lang %}
    {% for section in site.data[lang].community_data %}
    <h2>{{ section.name }}</h2>
    <div class="row">
      {% for item in section.data %}
      <div class="col-sm-6">
        <h3><a href="{{ item.url }}">{{ item.name }}</a></h3>
        <p>{{ item.text }}</p>
      </div>
      {% endfor %}
    </div><br />
    {% endfor %}
  </div>
</div>
