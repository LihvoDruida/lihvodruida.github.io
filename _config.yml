# ==============================================================================
# SITE SETTINGS
# ==============================================================================
title: Лігво Себаса
tagline: WoW гайди, гільдія, адони та новини
description: >-
  Україномовний хаб про World of Warcraft: гайди, адони, новини,
  сторінка гільдії Mistblossom Vanguard, Raider.IO статистика та корисні матеріали для спільноти.
lang: uk
locale: uk_UA
author:
  name: Sebas
  url: https://lihvodruida.pp.ua/
email: lihvo.druida@gmail.com
timezone: Europe/Kyiv
logo: /assets/img/guild-logo.webp
image: /assets/img/og-image-default.webp
url: "https://lihvodruida.pp.ua"
baseurl: ""

social:
  name: Лігво Себаса
  links:
    - https://www.youtube.com/@lihvo_druida
    - https://www.tiktok.com/@lihvo_druida
    - https://www.twitch.tv/lihvo_druida/about
    - https://discord.gg/SR8JsQBCxn

curseforge_profile_url: https://www.curseforge.com/members/lihvo_druida

# Інтеграції
github_repo_owner: "LihvoDruida"
github_repo_name: "lihvodruida.github.io"
guild_applications_api_url: "https://guild-applications.melles-android.workers.dev/api/guild-applications"
guild_applications_label: "guild-application"
default_keywords:
  - World of Warcraft
  - WoW
  - Warcraft
  - Raider.IO
  - гільдія
  - гайди
  - адони
  - Mythic+
  - рейди
  - українською

# ==============================================================================
# BUILD SETTINGS
# ==============================================================================
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

sass:
  style: compressed

# ==============================================================================
# COLLECTIONS
# ==============================================================================
collections:
  news:
    output: true
    permalink: /news/:slug/
    sort_by: date

  guides:
    output: true
    permalink: /guides/:slug/

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/news-placeholder.webp
      robots: index, follow, max-image-preview:large

  - scope:
      path: ""
      type: news
    values:
      layout: news
      categories: ["новини"]
      comments: true
      extra_css:
        - /assets/css/news.css
      seo:
        type: NewsArticle

  - scope:
      path: ""
      type: guides
    values:
      layout: guides
      categories: ["гайди"]
      toc: true
      extra_css:
        - /assets/css/news.css
      wowhead_tooltips: true
      seo:
        type: Article

# ==============================================================================
# PLUGINS (Стандартний набір GitHub Pages)
# ==============================================================================
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - dashboard/
  - workers/
  - scripts/
  - src/
  - public/
  - docs/
  - .github/
  - .env
  - .env.*
  - README.md
  - LICENSE
  - "*.zip"
  - "*.bak"
  - "*.tmp"
  - "*.tsbuildinfo"
  - "__pycache__/"
