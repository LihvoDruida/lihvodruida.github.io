<section id="socials" class="card socials-card">
  <div class="socials-content">
    <h3 class="welcome-text">Вітаю у моєму цифровому лігві!</h3>
    <div class="socials-links">
      <a href="{{ site.data.socials.youtube }}" target="_blank" rel="noopener noreferrer" class="btn-social yt">
        {% include social-icon.html name="youtube" %} YouTube
      </a>
      <a href="{{ site.data.socials.tiktok }}" target="_blank" rel="noopener noreferrer" class="btn-social tt">
        {% include social-icon.html name="tiktok" %} TikTok
      </a>
      <a href="{{ site.data.socials.twitch }}" target="_blank" rel="noopener noreferrer" class="btn-social tw">
        {% include social-icon.html name="twitch" %} Twitch
      </a>
      <a href="{{ site.data.socials.discord }}" target="_blank" rel="noopener noreferrer" class="btn-social dc">
        {% include social-icon.html name="discord" %} Discord
      </a>
    </div>
  </div>
</section>
