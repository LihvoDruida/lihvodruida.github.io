<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Сторінка допомагає безпечно повернутися до застосунку LihvoDruida після входу." />
    <title>Повернення до застосунку — Лігво Себаса</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #120f0d;
            color: #f5efe7;
        }
        .callback-shell {
            width: min(100%, 560px);
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.28);
        }
        a { color: #f1c270; }
        p { line-height: 1.6; }
        code { word-break: break-all; }
    </style>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");
            const error = params.get("error");
            const errorDescription = params.get("error_description");
            const qp = new URLSearchParams();

            if (code) qp.set("code", code);
            if (state) qp.set("state", state);
            if (error) qp.set("error", error);
            if (errorDescription) qp.set("error_description", errorDescription);

            const deepLink = `lihvodruida://callback?${qp.toString()}`;

            function render(title, description, linkText) {
                document.body.innerHTML = `
                    <main class="callback-shell">
                        <h1>${title}</h1>
                        <p>${description}</p>
                        <p><a href="${deepLink}">${linkText}</a></p>
                    </main>
                `;
            }

            if (code || error) {
                setTimeout(() => {
                    window.location.href = deepLink;
                }, 120);

                document.addEventListener("DOMContentLoaded", () => {
                    render(
                        "Переадресація до застосунку",
                        "Якщо застосунок не відкрився автоматично, скористайся посиланням нижче.",
                        "Відкрити застосунок вручну"
                    );
                });
            } else {
                document.addEventListener("DOMContentLoaded", () => {
                    document.body.innerHTML = `
                        <main class="callback-shell">
                            <h1>Не вдалося завершити вхід</h1>
                            <p>Ми не отримали потрібні дані для входу. Спробуй ще раз із застосунку.</p>
                        </main>
                    `;
                });
            }
        })();
    </script>
</head>
<body>
    <main class="callback-shell">
        <h1>Переадресація до застосунку</h1>
        <p>Зачекай кілька секунд. Якщо застосунок не відкрився сам, скористайся посиланням нижче.</p>
    </main>
</body>
</html>
