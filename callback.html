<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Redirect</title>
    <script>
        (function() {
            // Отримуємо код авторизації з URL
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");

            if (code) {
                // Створюємо глибоке посилання (Deep Link)
                const deepLink = `lihvodruida://callback?code=${code}&state=${state}`;

                // Додаємо затримку перед редиректом
                setTimeout(() => {
                    window.location.href = deepLink;
                }, 100); // 100 мс, щоб браузер встиг обробити

                // Додаємо кнопку на випадок, якщо редирект не спрацює
                document.body.innerHTML = `
                    <h2>Redirecting...</h2>
                    <p>If you are not redirected, <a id="redirectLink" href="${deepLink}">click here</a>.</p>
                `;
            } else {
                document.body.innerHTML = "<h2>Error: Authorization code not found.</h2>";
            }
        })();
    </script>
</head>
<body>
    <h2>Redirecting...</h2>
</body>
</html>
