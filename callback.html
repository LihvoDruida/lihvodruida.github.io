<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Redirect</title>
    <script>
        (function() {
            // Отримуємо код авторизації з URL
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");
            const state = params.get("state");

            if (code) {
                // Перенаправляємо у ваш мобільний додаток (Deep Link)
                window.location.href = `wowtracker://oauth/callback?code=${code}&state=${state}`;
            } else {
                document.body.innerHTML = "<h2>Error: Authorization code not found.</h2>";
            }
        })();
    </script>
</head>
<body>
    <h2>Redirecting...</h2>
</body>
</html>
