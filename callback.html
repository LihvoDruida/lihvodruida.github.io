<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAuth Redirect</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            const code = params.get("code");
            const state = params.get("state");
            const error = params.get("error");
            const errorDescription = params.get("error_description");

            const qp = new URLSearchParams();

            if (code) qp.set("code", code);
            if (state) qp.set("state", state);
            if (error) qp.set("error", error);
            if (errorDescription) qp.set("error_description", errorDescription);

            const deepLink = `lihvodruida://callback?${qp.toString()}`;

            if (code || error) {
                setTimeout(() => {
                    window.location.href = deepLink;
                }, 120);

                document.addEventListener("DOMContentLoaded", () => {
                    document.body.innerHTML = `
                        <h2>Redirecting...</h2>
                        <p>If the app did not open automatically,
                        <a id="redirectLink" href="${deepLink}">tap here</a>.</p>
                    `;
                });
            } else {
                document.addEventListener("DOMContentLoaded", () => {
                    document.body.innerHTML =
                        "<h2>Error: Authorization code or error payload not found.</h2>";
                });
            }
        })();
    </script>
</head>
<body>
    <h2>Redirecting...</h2>
</body>
</html>
